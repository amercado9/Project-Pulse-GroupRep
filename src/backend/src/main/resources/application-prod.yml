spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY}
    token-expiry-in-hours: ${SECURITY_JWT_TOKEN_EXPIRY_IN_HOURS:24}

front-end:
  url: ${FRONTEND_URL}

app:
  timezone: America/Chicago
  reminders:
    enabled: ${APP_REMINDERS_ENABLED:false}
    cron: ${APP_REMINDERS_CRON:0 0 8 * * *}

management:
  health:
    mail:
      enabled: false

server:
  port: ${PORT:80}
